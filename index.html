<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ActionsCI — Reusable GitHub Actions Workflows</title>
    <meta name="description" content="Composable, reusable GitHub Actions workflows with a single cicd.yaml config. Scaffold repos with AGENTS.md for AI coding agents. Built for teams that ship." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://actionsci.com/" />
    <meta property="og:title" content="ActionsCI — Reusable GitHub Actions Workflows" />
    <meta property="og:description" content="Composable, reusable GitHub Actions workflows with a single cicd.yaml config. Scaffold repos with AGENTS.md for AI coding agents. Built for teams that ship." />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ActionsCI — Reusable GitHub Actions Workflows" />
    <meta name="twitter:description" content="Composable, reusable GitHub Actions workflows with a single cicd.yaml config. Scaffold repos with AGENTS.md for AI coding agents. Built for teams that ship." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Apply saved theme before first paint to prevent flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
