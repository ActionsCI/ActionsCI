<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <!-- Dot grid pattern -->
  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00ff88" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo mark -->
  <polygon points="80,290 120,315 80,340" fill="#00ff88"/>
  <!-- Brand name -->
  <text x="135" y="325" font-family="monospace" font-size="36" font-weight="bold" fill="#f0f0f0">ActionsCI</text>
  <!-- Tagline -->
  <text x="80" y="390" font-family="monospace" font-size="52" font-weight="bold" fill="#f0f0f0">Ship product.</text>
  <text x="80" y="455" font-family="monospace" font-size="52" font-weight="bold" fill="#00ff88">Not pipelines.</text>
  <!-- Subtext -->
  <text x="80" y="520" font-family="sans-serif" font-size="24" fill="#6b6b6b">Reusable GitHub Actions workflows for AI-powered teams.</text>
</svg>
